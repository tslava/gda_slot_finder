name: Deploy to Hetzner Cloud VPC

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.9

    - name: Install dependencies
      run: pip install --no-cache-dir -r requirements.txt

    - name: Deploy to Hetzner Cloud VPC
      env:
        HETZNER_TOKEN: ${{ secrets.HETZNER_TOKEN }}
      run: |
        ssh-keyscan -H ${{ secrets.HOST_IP }} >> ~/.ssh/known_hosts
        ssh -i ${{ secrets.SSH_PRIVATE_KEY }} -o StrictHostKeyChecking=no ${{ secrets.HOST_USERNAME }}@${{ secrets.HOST_IP }} 'cd /path/to/your/code && git pull && python main.py'
